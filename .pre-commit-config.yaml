repos:
  - repo: local
    hooks:
      - id: cpitd
        name: cpitd (clone detection)
        entry: venv-cpitd/bin/cpitd
        args: ["granofel/", "tool/", "examples/", "--ignore", "tests/*", "--suppress", "*@abstractmethod*"]
        language: system
        pass_filenames: false
        always_run: true
